name: bant_mobile
description: Android-first Flutter client for BANT.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.3
  livekit_client: ^2.3.3
  go_router: ^14.8.1
  url_launcher: ^6.3.1
  permission_handler: ^11.3.1
  app_links: ^6.3.3
  shared_preferences: ^2.3.5
  image_picker: ^1.1.2
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/bant-mascot.png
